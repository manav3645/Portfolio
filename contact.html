<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Me</title>
    
    <!-- Boxicons for Icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Root Variables */
        :root {
            --bg-color: #1f1f21;
            --text-color: #ffffff;
            --main-color: #ffae00;
            --secondary-color: #333;
            --big-font: 2rem;
            --p-font: 1.1rem;
        }

        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rubik', sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }

        /* Section Title */
        h2 {
            text-align: center;
            margin-top: 80px;
            font-size: var(--big-font);
            color: var(--main-color);
        }

        /* Contact Section */
        .contact-section {
            width: 60%;
            margin: 50px auto;
            text-align: center;
        }

        .contact-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .contact-card {
            background: #2a2a2c;
            padding: 15px;
            width: 300px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(255, 174, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .contact-card:hover {
            transform: scale(1.1);
        }

        .contact-icon {
            font-size: 30px;
            color: var(--main-color);
            margin-bottom: 10px;
        }

        .contact-info {
            font-size: 1.1rem;
            color: #ccc;
        }

        /* Contact Form */
        .contact-form {
            margin-top: 40px;
            width: 100%;
            max-width: 500px;
            background: #2a2a2c;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(255, 174, 0, 0.3);
        }

        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #333;
            color: var(--text-color);
        }

        .contact-form button {
            width: 100%;
            padding: 10px;
            background: var(--main-color);
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            color: var(--bg-color);
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .contact-form button:hover {
            background: #d99200;
        }

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="#" class="sklogo">
            <h1>Contact Me</h1>
        </a>
    </header>

    <!-- Contact Section -->
    <h2>Contact Information</h2>
    <section class="contact-section">
        <div class="contact-container">
            <div class="contact-card">
                <i class='bx bx-envelope contact-icon'></i>
                <div class="contact-info">manavroyals436@gmail.com</div>
            </div>

            <div class="contact-card">
                <i class='bx bx-phone contact-icon'></i>
                <div class="contact-info">+91-936059xxxx</div>
            </div>

            <div class="contact-card">
                <i class='bx bx-map contact-icon'></i>
                <div class="contact-info">Nagapattinam, India</div>
            </div>

            <div class="contact-card">
                <i class='bx bxl-linkedin contact-icon'></i>
                <div class="contact-info"><a href="https://www.linkedin.com/in/manav-a-220315249/" style="color: var(--main-color); text-decoration: none;">LinkedIn Profile</a></div>
            </div>

            <div class="contact-card">
                <i class='bx bxl-github contact-icon'></i>
                <div class="contact-info"><a href="https://github.com/manav3645" style="color: var(--main-color); text-decoration: none;">GitHub Profile</a></div>
            </div>
        </div>
    </section>

    <!-- Contact Form -->
    <h2>Send a Message</h2>
    <section class="contact-section">
        <form class="contact-form">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="4" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

</body>
</html>
